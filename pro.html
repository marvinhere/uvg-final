 security:[
 [{title:'Una reseña de cliente incluye código HTML con eventos ejecutables. El equipo quiere conservar formato básico.',opts:['Usar una lista permitida de etiquetas y atributos, sanitizar antes de renderizar y preferir textContent para texto plano.','Aplicar Content Security Policy estricta y conservar innerHTML con el contenido original.','Escapar únicamente las etiquetas script y permitir el resto de atributos HTML.'],correct:0,impact:8,why:'CSP ayuda como defensa adicional, pero no sustituye la sanitización y la codificación de salida. Los eventos inline también pueden ser peligrosos.'},
 {title:'Una clave privada del proveedor de pagos aparece en el bundle JavaScript publicado.',opts:['Rotar la clave comprometida, moverla al servidor y usar un endpoint autorizado con controles de acceso.','Moverla a una variable de entorno durante el build y evitar subirla al repositorio.','Cifrar la clave en el bundle y descifrarla al ejecutar JavaScript en el navegador.'],correct:0,impact:10,why:'El navegador recibe el bundle y sus secretos. Una variable de entorno inyectada al build sigue siendo pública; además hay que rotar la clave expuesta.'},
 {title:'Un cliente altera el precio en DevTools antes de confirmar la compra.',opts:['Firmar los importes en el frontend y comparar la firma antes de enviarlos.','Recalcular y validar precio, descuentos e inventario en el servidor usando datos de confianza.','Congelar el campo de precio y enviar el total con un campo readonly.'],correct:1,impact:9,why:'El cliente puede manipular el DOM y el JavaScript. La autoridad sobre precios y cobros debe estar en el servidor.'}],
 [{title:'El perfil de usuario admite biografías con enlaces y texto enriquecido.',opts:['Permitir HTML de un editor confiable y activar SameSite en las cookies.','Aplicar sanitización con lista permitida y política de contenido como defensa adicional.','Filtrar solo la palabra javascript en el texto antes de insertar innerHTML.'],correct:1,impact:8,why:'La sanitización del HTML debe controlar etiquetas, atributos y URLs; CSP es complementaria.'},
 {title:'Un token de acceso a un servicio de correo se encuentra en el código cliente.',opts:['Cambiarlo por un token con menos permisos y mantenerlo en el navegador.','Ocultarlo en un archivo .env del proyecto frontend y reconstruir.','Revocarlo y regenerarlo, mover la integración al backend y limitar permisos.'],correct:2,impact:10,why:'Una credencial enviada al navegador está expuesta. Debe revocarse y manejarse del lado servidor.'},
 {title:'El navegador envía un descuento alterado al endpoint de pago.',opts:['Validar en backend la elegibilidad y el importe de descuentos contra reglas y datos propios.','Conservar la validación en frontend y añadir un checksum calculado allí.','Enviar el descuento en una cabecera personalizada en lugar del body.'],correct:0,impact:9,why:'Una cabecera o checksum del cliente no es una garantía. El servidor debe decidir qué descuento es válido.'}]

 incident:[
 [{title:'Una actualización elevó los errores 5xx al 18%. La versión anterior está verificada y la base de datos permanece estable.',opts:['Activar rollback controlado a la versión estable, preservar logs y comunicar el incidente.','Mantener la versión nueva, bajar el tráfico un 50% y seguir observando mientras se investiga.','Desactivar temporalmente el checkout y desplegar un hotfix sin pasar por staging.'],correct:0,impact:9,why:'Con degradación grave y versión anterior estable, el rollback controlado suele reducir más rápido la exposición. Reducir tráfico no corrige el error y un hotfix sin validar agrega riesgo.'},
 {title:'Hay un parche candidato. ¿Cómo se valida antes de restaurar el servicio?',opts:['Ejecutar solo pruebas unitarias del módulo afectado y desplegar a todos.','Verificar el flujo de compra en staging, ejecutar regresión crítica y preparar reversión.','Probar el parche directamente con un 100% del tráfico y revertir si falla.'],correct:1,impact:7,why:'La regresión crítica y el flujo extremo a extremo reducen fallos cruzados antes de afectar usuarios.'},
 {title:'Tras liberar el parche, la tasa de errores vuelve a aumentar.',opts:['Esperar al menos 30 minutos para evitar falsas alarmas.','Reducir el nivel de logs para mejorar el rendimiento antes de decidir.','Evaluar métricas y trazas contra umbrales, detener la liberación y revertir si corresponde.'],correct:2,impact:8,why:'La respuesta debe basarse en telemetría y umbrales predefinidos, con reversión rápida cuando hay regresión.'}],
 [{title:'Un cambio en el servicio de pedidos duplica el tiempo de respuesta y provoca timeouts. La versión previa funciona.',opts:['Escalar instancias y mantener el despliegue mientras se investiga.','Revertir gradualmente a la versión estable y preservar evidencias del incidente.','Subir el timeout del cliente a 90 segundos y esperar el comportamiento real.'],correct:1,impact:9,why:'Escalar o aumentar timeouts puede enmascarar el problema; volver a una versión conocida estable limita el impacto.'},
 {title:'Se propone desplegar una corrección urgente del cálculo de impuestos.',opts:['Validar impuestos, totales y checkout en staging, correr regresión crítica y contar con rollback.','Ejecutar una prueba manual del caso reportado y desplegar a todos los usuarios.','Aplicar el parche sobre el servidor en vivo y comparar los resultados después.'],correct:0,impact:8,why:'La urgencia no elimina la necesidad de verificar casos adyacentes y tener un plan de reversión.'},
 {title:'El monitoreo detecta nuevos fallos al 10% del despliegue canario.',opts:['Completar el despliegue para obtener una muestra más representativa.','Desactivar las alertas ruidosas y observar el dashboard general.','Pausar el despliegue, contrastar métricas con la versión estable y revertir el canario.'],correct:2,impact:8,why:'El canario existe para detener el despliegue ante regresiones tempranas.'}],
 [{title:'Una nueva versión genera fallos de sesión al 15% de los usuarios. Existe una versión anterior estable.',opts:['Aplicar un cambio directo en producción para restaurar sesiones sin validación.','Aumentar los reintentos de autenticación y monitorear durante una hora.','Revertir de forma controlada, registrar evidencia y comprobar la recuperación de sesiones.'],correct:2,impact:9,why:'Los reintentos pueden amplificar la carga y un parche no probado agrava la incidencia.'},
 {title:'Se corrigió la gestión de sesiones y se solicita autorizar el parche.',opts:['Probar inicio/cierre de sesión, permisos, regresión y rollback en un entorno representativo.','Desplegar el parche al 100% porque solo modifica autenticación.','Validar exclusivamente el inicio de sesión del administrador.'],correct:0,impact:8,why:'La autenticación requiere validar múltiples rutas, permisos y regresiones antes de publicar.'},
 {title:'El despliegue canario muestra una caída inesperada en conversiones y errores de login.',opts:['Esperar al final de la campaña antes de evaluar.','Detener la progresión, contrastar telemetría y revertir el canario si se confirma el deterioro.','Incrementar el número de instancias para compensar los errores de login.'],correct:1,impact:8,why:'La progresión del canario se detiene ante señales de degradación; escalar no soluciona necesariamente errores funcionales.'}]

 [{title:'Integridad del checkout',opts:['Verificar precio, inventario y pago desde reglas confiables del servidor.','Comparar únicamente el total del frontend con el valor mostrado al usuario.'],correct:0,impact:8,why:'El servidor debe ser autoridad para los importes.'},{title:'Accesibilidad mínima',opts:['Verificar navegación con teclado, etiquetas, foco y mensajes de error.','Probar con lector de pantalla solo la portada y dar por aprobado el checkout.'],correct:0,impact:4,why:'La accesibilidad debe cubrir el flujo crítico.'},{title:'Autorización de salida',opts:['Confirmar pruebas, plan de reversión, monitoreo y responsables de respuesta.','Autorizar cuando las pruebas unitarias estén verdes, dejando monitoreo para después.'],correct:0,impact:7,why:'La liberación necesita un plan de operación y respuesta.'}],

 [{title:'Validación de pedido',opts:['Recalcular importes e inventario en backend antes de cobrar.','Confiar en el total del cliente si se envía por HTTPS.'],correct:0,impact:8,why:'HTTPS protege el tránsito, no la confiabilidad del origen de datos.'},{title:'Accesibilidad del checkout',opts:['Probar solamente en dispositivos móviles modernos.','Comprobar teclado, lectores de pantalla, etiquetas y recuperación de errores.'],correct:1,impact:4,why:'La accesibilidad exige más que compatibilidad con dispositivos.'},{title:'Publicación controlada',opts:['Usar checklist de regresión, monitoreo y plan de reversión aprobado.','Publicar y programar revisión de logs para el día siguiente.'],correct:0,impact:7,why:'El monitoreo debe estar activo durante el despliegue.'}]
 ]

const initial=()=>({name:'',stage:0,score:100,errors:0,penalties:[],attempts:[0,0,0,0,0,0],completed:[],started:0,finishedAt:0,seed:[],evidence:[],answers:{},security:0,incident:0,launch:0,locked:false,absenceCount:0,blockedByAbsence:false,absenceHistory:[]});
let state=initial();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function restore(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object'&&x.name&&Array.isArray(x.seed)&&x.seed.length===6)state={...initial(),...x}}catch(e){}}
function randomInt(n){if(globalThis.crypto&&crypto.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)}
function variant(k){return library[k][state.seed[names.indexOf(k)]||0]}
function v(k){return library[k][state.seed[({diagnosis:0,frontend:1,cart:2,security:3,incident:4,launch:5})[k]]]}
function updateHeader(){$('headerName').textContent=state.name||'SIN IDENTIFICAR';$('headerPhase').textContent=state.blockedByAbsence?'ACCESO BLOQUEADO':state.locked?'MISIÓN CERRADA':state.name?'FASE '+(state.stage+1)+'/6':'MISIÓN NO INICIADA'}
function progress(){return `<div class="steps">${names.map((n,i)=>`<div class="step ${state.completed.includes(i)?'done':i===state.stage?'active':''}" title="${esc(n)}"></div>`).join('')}</div><div class="row space" style="margin-bottom:16px"><span class="tag">FASE ${state.stage+1} · ${names[state.stage]}</span><span class="pill">Puntuación: <b>${state.score}/100</b> · Fallos: ${state.errors}</span></div>`}
function shell(content){updateHeader();const active=state.name&&!state.locked&&!state.blockedByAbsence&&state.stage<6;const alerts=active?'<div id="resultMessages" role="status" aria-live="polite"><div id="penaltyMsg" class="notice hidden"></div><div id="feedback" class="notice hidden"></div></div>':'';app.innerHTML=(active?progress():'')+alerts+content}
function showResultTop(){const el=$('resultMessages');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}function feedback(msg,good){let el=$('feedback');if(el){el.className='notice '+(good?'good':'bad');el.textContent=msg;showResultTop()}}
function penalty(level,why){if(state.locked||state.completed.includes(state.stage))return;let pts=Math.max(1,Math.min(10,level));state.score=Math.max(0,state.score-pts);state.errors++;state.attempts[state.stage]++;state.penalties.push({stage:state.stage,points:pts,reason:why,time:Date.now()});persist();let p=$('scoreLive');if(p)p.textContent=state.score+'/100';let m=$('penaltyMsg');if(m){m.className='notice bad';m.textContent=`INCIDENTE · −${pts} puntos. ${why} Impacto profesional: una decisión incorrecta puede comprometer ventas, datos de clientes o continuidad operativa. Corrige y vuelve a intentarlo.`;showResultTop()}updateHeader()}
function win(msg){if(state.completed.includes(state.stage))return;state.completed.push(state.stage);persist();feedback('FASE SUPERADA · '+msg+' Sin puntos adicionales: conservas la puntuación acumulada.',true);let btn=$('advance');if(btn)btn.hidden=false;document.querySelectorAll('.test-btn,.option').forEach(b=>b.disabled=true)}
function next(){if(!state.completed.includes(state.stage))return;state.stage++;if(state.stage>=6){state.locked=true;state.finishedAt=Date.now()}persist();render()}
function controls(){return `<button id="advance" class="btn" hidden onclick="next()">Continuar →</button>`}
function intro(){shell(`<section class="panel"><div class="tag">ALERTA ROJA · CONTRATO DE EMERGENCIA</div><h1>Operación Rescate Web</h1><p>Una empresa de comercio electrónico enfrenta fallos críticos antes de una campaña. Tu misión es investigar, reparar y desplegar sin comprometer la operación.</p><div class="grid"><div class="card"><h3>6 fases obligatorias</h3><p>Diagnóstico, frontend, carrito, seguridad, incidente de producción y lanzamiento. No podrás avanzar sin superar el reto actual.</p></div><div class="card"><h3>Evaluación de 100 puntos</h3><p>Comienzas con <b>100/100</b>. Cada error descuenta de 3 a 10 puntos según su gravedad. El error no impide aprender: puedes reintentar hasta resolverlo. Una vez completada la misión, queda cerrada en este navegador.</p></div></div><div class="risk"><strong>Advertencia profesional:</strong> Las decisiones inseguras pueden comprometer a una institución completa. Lee las evidencias y evalúa el impacto antes de actuar.</div><label for="student">Nombre completo del estudiante</label><input id="student" maxlength="90" placeholder="Nombre y apellido"><div style="margin-top:17px"><button class="btn" onclick="start()">Aceptar misión e iniciar →</button></div></section>`)}
function start(){if(state.name || state.locked || state.blockedByAbsence)return;let name=$('student').value.trim();if(name.length<5)return alert('Ingresa tu nombre completo.');state=initial();state.name=name;state.started=Date.now();state.seed=[randomInt(3),randomInt(3),randomInt(3),randomInt(2),randomInt(3),randomInt(3)];persist();render()}
function stage0(){let t=v('diagnosis');shell(`<section class="panel"><h2>01 · Diagnóstico de emergencia</h2><p>${esc(t.context)} Inspecciona las <b>cuatro evidencias</b> antes de identificar la causa raíz. Cada fuente aporta un dato que puede confirmar o descartar hipótesis.</p><div class="grid"><div><h3>Fuentes de evidencia</h3>${['Consola','Inspector DOM','Código fuente','Panel de red'].map((n,i)=>`<button class="option" onclick="inspect(${i})">🔎 ${n} ${state.evidence.includes(i)?'✓':''}</button>`).join('')}</div><div><h3>Registro técnico</h3><div id="terminal" class="terminal">Selecciona una evidencia.</div></div></div><h3>¿Cuál es la causa raíz?</h3>${t.choices.map((x,i)=>`<button class="option test-btn" onclick="diagnose(${i})">${esc(x)}</button>`).join('')}${controls()}</section>`)}
function inspect(i){if(!state.evidence.includes(i)){state.evidence.push(i);persist()}$('terminal').textContent=v('diagnosis').evidence[i]}
function diagnose(i){if(state.evidence.length<4){$('penaltyMsg').className='notice';$('penaltyMsg').textContent='Debes revisar las cuatro evidencias antes de emitir el diagnóstico. No hay penalización por investigar.';showResultTop();return}let t=v('diagnosis');if(i!==t.correct)return penalty(4,'Diagnóstico incorrecto: actuar sobre una causa no comprobada retrasa la recuperación y consume recursos.');win(t.why)}
function stage1(){let t=v('frontend');let code=state.answers.frontend??t.starter.replaceAll('\\n','\n');shell(`<section class="panel"><h2>02 · Reparación del frontend</h2><p>El equipo reporta un botón inoperante. Corrige el HTML/JavaScript del fragmento. <b>${esc(t.goal)}</b></p><div class="grid"><div><h3>Editor de reparación</h3><textarea id="editor" class="editor" spellcheck="false">${esc(code)}</textarea><button class="btn test-btn" onclick="testFrontend()">▶ Ejecutar prueba funcional</button></div><div><h3>Criterios de aceptación</h3><div class="terminal">1. Debe existir el botón con id="${t.button}".\n2. Debe existir el elemento id="estado".\n3. Un clic debe cambiar #estado a "${t.expected}".\n4. No debe haber errores de ejecución.</div><p class="hintline">Puedes cambiar el selector JavaScript, pero la prueba espera los identificadores y el texto especificados. La prueba se ejecuta en un documento aislado.</p><details class="detail" style="margin-top:14px" open><summary>📘 Guía rápida: document.getElementById()</summary><p><b>¿Para qué sirve?</b> Busca un elemento HTML por el valor exacto de su atributo <code>id</code>.</p><div class="terminal">HTML: &lt;button id="comprar"&gt;Comprar&lt;/button&gt;
JS: const boton = document.getElementById("comprar");</div><p><b>Regla importante:</b> el texto dentro de los paréntesis debe coincidir exactamente con el <code>id</code> del HTML (respeta mayúsculas, minúsculas y letras). No escribas <code>#</code> dentro de <code>getElementById</code>.</p><p><b>Escuchar un clic:</b> <code>boton.addEventListener("click", () =&gt; { ... });</code> ejecuta instrucciones cuando se presiona el botón.</p><p><b>Cambiar texto:</b> <code>document.getElementById("estado").textContent = "Listo";</code> modifica el contenido del indicador.</p><p><b>Si obtienes null:</b> comprueba que el identificador exista y que el script se ejecute después de crear el elemento HTML. En este reto, busca el selector que no coincide con el botón.</p></details></div></div>${controls()}</section>`)}
function testFrontend(){let t=v('frontend'),code=$('editor').value;state.answers.frontend=code;persist();try{let doc=new DOMParser().parseFromString(code,'text/html');let button=doc.getElementById(t.button),status=doc.getElementById(t.target);if(!button||!status)throw Error('Falta el botón o el indicador de estado requerido.');let scripts=[...doc.querySelectorAll('script')].map(x=>x.textContent);if(!scripts.length)throw Error('No hay un bloque script para registrar el evento.');doc.querySelectorAll('script').forEach(x=>x.remove());let runner=new Function('document','window','alert',scripts.join('\n'));runner(doc,{},()=>{});button.click();if(status.textContent.trim()!==t.expected)throw Error('El clic no actualizó el estado esperado.');win('El evento se registra y el estado se actualiza correctamente.')}catch(e){penalty(3,'La prueba funcional no pasó: '+e.message)}}
function stage2(){let t=v('cart'),code=state.answers.cart??t.starter.replaceAll('\\n','\n');shell(`<section class="panel"><h2>03 · Rescate del carrito</h2><p>El sistema calcula mal el importe de los pedidos. Corrige la función <code>calcularTotal(items, descuento)</code> sin cambiar su nombre ni los nombres de sus parámetros.</p><div class="grid"><div><h3>Editor JavaScript · ${esc(t.label)}</h3><textarea id="editor" class="editor" spellcheck="false">${esc(code)}</textarea><button class="btn test-btn" onclick="testCart()">▶ Ejecutar 5 pedidos de prueba</button><div class="risk" style="margin-top:14px"><strong>¿No puedes resolver el código?</strong><p style="margin:7px 0 12px">Puedes omitir este reto y avanzar a la siguiente fase, pero se descontarán <b>15 puntos</b> de tu calificación sobre 100. Esta decisión quedará registrada como reto omitido y no podrás volver a resolverlo.</p><button class="btn secondary test-btn" onclick="skipCart()">Omitir reto · −15 puntos</button></div></div><div><h3>Contrato de la función</h3><div class="detail"><p><b>1. Parámetro items:</b> arreglo de objetos. Cada objeto contiene <code>precio</code> (valor unitario en quetzales) y <code>cantidad</code> (número de unidades).</p><p><b>2. Parámetro descuento:</b> es un <b>entero entre 0 y 100</b> que REPRESENTA un porcentaje. Por ejemplo, <code>10</code> significa <b>10%</b>; no significa Q10 y tampoco debes tratarlo como <code>0.10</code>.</p><p><b>3. Subtotal:</b> suma <code>precio × cantidad</code> de cada artículo.</p><p><b>4. Descuento:</b> calcula <code>subtotal × (descuento / 100)</code>.</p><p><b>5. Resultado:</b> devuelve un <b>número</b> con el subtotal menos el descuento. Si no hay artículos, devuelve 0.</p></div><div class="terminal">Ejemplo de entrada:\nitems = [{precio:100,cantidad:2}, {precio:50,cantidad:1}]\ndescuento = 10\n\nSubtotal = 100×2 + 50×1 = Q250\nDescuento = 250×(10/100) = Q25\nResultado esperado = 225 (Q225)</div><p class="hintline">${esc(t.desc)} Se probarán cantidades, descuentos y carritos vacíos.</p></div></div>${controls()}</section>`)}
function skipCart(){
  if(state.stage!==2 || state.completed.includes(2) || state.locked || state.blockedByAbsence)return;
  if(!confirm('¿Confirmas que deseas omitir el reto del carrito? Se descontarán 15 puntos, quedará registrado y no podrás volver a resolver esta fase.'))return;
  state.answers.cart=$('editor')?.value ?? state.answers.cart ?? '';
  state.score=Math.max(0,state.score-15);
  state.errors++;
  state.attempts[2]++;
  state.penalties.push({stage:2,points:15,reason:'Reto del carrito omitido voluntariamente; no se verificó la solución de programación.',time:Date.now()});
  state.completed.push(2);
  persist();
  render();
  feedback('RETO OMITIDO · Se descontaron 15 puntos. Esta fase queda registrada como omitida y puedes continuar.',false);
  let advance=$('advance');if(advance)advance.hidden=false;
  document.querySelectorAll('.test-btn,.option').forEach(b=>b.disabled=true);
  let score=$('scoreLive');if(score)score.textContent=state.score+'/100';
}
function testCart(){let t=v('cart'),code=$('editor').value;state.answers.cart=code;persist();try{let fn=new Function('"use strict";'+code+';return calcularTotal;')();if(typeof fn!=='function')throw Error('No existe la función calcularTotal.');for(let [items,d,expected] of t.cases){let result=fn(JSON.parse(JSON.stringify(items)),d);if(typeof result!=='number'||!Number.isFinite(result)||Math.abs(result-expected)>1e-6)throw Error(`Para un pedido se esperaba Q${expected}, pero la función devolvió ${String(result)}.`)}win('Cinco pedidos verificados: cantidades y descuentos correctos.')}catch(e){penalty(5,'Un cálculo incorrecto puede provocar pérdidas económicas, cobros indebidos y reclamos. '+e.message)}}
function decisionStage(key,idx,title,intro,handler){let tasks=v(key),i=state[idx],t=tasks[i];shell(`<section class="panel"><h2>${title}</h2><p>${intro}</p><div class="row space"><span class="tag">CASO ${Math.min(i+1,tasks.length)} DE ${tasks.length}</span><span class="pill">Puntuación actual: <b id="scoreLive">${state.score}/100</b></span></div><div class="bar"><div class="fill" style="width:${i/tasks.length*100}%"></div></div><div class="card" style="margin-top:17px"><h3>${t?esc(t.title):'Todos los controles aprobados'}</h3>${t?t.opts.map((o,j)=>`<button class="option test-btn" onclick="${handler}(${j})">${esc(o)}</button>`).join(''):'<p>Proceso completado.</p>'}</div>${key==='incident' && /canario/i.test(t.title)?'<div class="notice"><strong>¿Qué es un despliegue canario?</strong> Es una estrategia que consiste en publicar una nueva versión de una aplicación para un pequeño porcentaje de usuarios antes de liberarla para todos. Esto permite detectar errores, monitorear el funcionamiento y regresar a la versión anterior si se presentan problemas, evitando afectar a toda la organización.</div>':''}<p class="hintline">Evalúa la efectividad, los riesgos residuales y la continuidad operativa. Las opciones son plausibles, pero solo una responde completamente al escenario.</p>${controls()}</section>`)}
function answer(key,idx,i){let t=v(key)[state[idx]];if(!t)return;if(i!==t.correct)return penalty(t.impact,'Decisión insuficiente. '+t.why);state[idx]++;persist();if(state[idx]===v(key).length){win('Controles superados. '+t.why)}else render()}
function stage3(){decisionStage('security','security','04 · Seguridad de la plataforma','Tres vulnerabilidades amenazan datos y pagos. Selecciona el control que realmente elimina o reduce la causa del riesgo, no solo sus síntomas.','securityAnswer')}
function securityAnswer(i){answer('security','security',i)}
function stage4(){decisionStage('incident','incident','05 · Incidente en producción','La campaña comienza en minutos. Las decisiones deben reducir el impacto sin sacrificar integridad de datos. No todas las medidas técnicamente posibles son las más seguras en esta situación.','incidentAnswer')}
function incidentAnswer(i){answer('incident','incident',i)}
function stage5(){decisionStage('launch','launch','06 · Lanzamiento final','El equipo solicita autorización para liberar la plataforma. Completa tres controles críticos antes de aprobar el despliegue.','launchAnswer')}
function launchAnswer(i){answer('launch','launch',i)}
function finish(){let mins=Math.max(1,Math.round(((state.finishedAt||Date.now())-state.started)/60000));shell(`<section class="panel" style="text-align:center"><div class="tag">MISIÓN FINALIZADA · REGISTRO CERRADO</div><h1>✓ Plataforma recuperada</h1><p>El estudiante superó las seis fases. Este navegador no permite iniciar una nueva misión desde la interfaz después del cierre.</p><div class="grid"><div class="card"><div class="muted">Estudiante</div><h2>${esc(state.name)}</h2></div><div class="card"><div class="muted">Calificación final</div><div class="score">${state.score} / 100</div></div><div class="card"><div class="muted">Intentos fallidos</div><div class="score">${state.errors}</div></div><div class="card"><div class="muted">Duración aproximada</div><div class="score">${mins} min</div></div></div><div class="detail" style="text-align:left"><h3>Registro de penalizaciones</h3>${state.penalties.length?state.penalties.map((x,i)=>`<p class="small">${i+1}. Fase ${x.stage+1} · −${x.points} puntos · ${esc(x.reason)}</p>`).join(''):'<p>Sin penalizaciones.</p>'}</div><p class="small">La misión está cerrada en este navegador, incluso después de recargar. El registro es local y puede alterarse mediante herramientas del navegador o borrando sus datos; para un cierre inviolable hace falta un servidor con autenticación y registro de intentos.</p><button class="btn" onclick="window.print()">Imprimir constancia / Guardar PDF</button></section>`)}
function render(){if(!state.name)return intro();if(state.blockedByAbsence)return blockedScreen();if(state.locked||state.stage>=6)return finish();[stage0,stage1,stage2,stage3,stage4,stage5][state.stage]();if(state.stage===2&&state.completed.includes(2)){feedback('RETO OMITIDO · Penalización de 15 puntos registrada. Puedes continuar.',false);let b=$('advance');if(b)b.hidden=false;document.querySelectorAll('.test-btn').forEach(b=>b.disabled=true)}}
// Control de permanencia: cada salida cuenta una sola vez hasta recuperar foco y visibilidad.
let away=false;
let monitorReady=false;
let blurTimer=null;
let pendingWarning=false;
function activeMission(){return Boolean(state.name && !state.locked && !state.blockedByAbsence && state.stage<6)}
function registerAbsence(source){
  if(!monitorReady || !activeMission() || away)return;
  saveEditorDraft();
  away=true;
  state.absenceCount=(state.absenceCount||0)+1;
  state.absenceHistory.push({at:Date.now(),stage:state.stage,source});
  if(state.absenceCount>=2){state.blockedByAbsence=true;state.locked=true;state.finishedAt=Date.now();}
  else pendingWarning=true;
  persist();
  if(state.blockedByAbsence)render();
}
function saveEditorDraft(){
  if(!activeMission())return;
  const editor=$('editor');
  if(!editor)return;
  if(state.stage===1)state.answers.frontend=editor.value;
  if(state.stage===2)state.answers.cart=editor.value;
  persist();
}
function recovered(){
  clearTimeout(blurTimer);
  if(document.hidden || !document.hasFocus())return;
  away=false;
  if(state.blockedByAbsence){render();return;}
  if(pendingWarning){pendingWarning=false;showAbsenceWarning();}
}
function showAbsenceWarning(){
  if(!activeMission() || document.getElementById('absenceOverlay'))return;
  const layer=document.createElement('div');
  layer.id='absenceOverlay';layer.className='absence-overlay';layer.setAttribute('role','alertdialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-labelledby','absenceTitle');
  layer.innerHTML='<section class="panel absence-dialog"><div class="tag">ADVERTENCIA DE PERMANENCIA · 1 DE 2</div><h2 id="absenceTitle">Se detectó una salida de la actividad</h2><p>El navegador registró que cambiaste de pestaña, minimizaste o dejaste de tener activa esta ventana.</p><div class="risk"><strong>Primera incidencia:</strong> puedes continuar. Una segunda salida bloqueará definitivamente esta misión en este navegador, incluso si recargas la página.</div><button class="btn" id="ackAbsence">Entendido · Continuar misión</button></section>';
  document.body.appendChild(layer);
  document.getElementById('ackAbsence').addEventListener('click',()=>{layer.remove(); if(activeMission() && !state.completed.includes(state.stage)) { const b=document.querySelector('.test-btn'); if(b)b.disabled=false; } });
  document.getElementById('ackAbsence').focus();
}
function unlockMission(){
  if(!state.blockedByAbsence)return;
  const field=$('teacherPassword');
  const message=$('unlockFeedback');
  if(!field)return;
  if(field.value!=='tech01'){
    field.value='';
    message.textContent='Contraseña incorrecta. Solicita la autorización del docente.';
    message.className='notice bad';
    field.focus();
    return;
  }
  state.blockedByAbsence=false;
  state.locked=false;
  state.finishedAt=0;
  state.absenceCount=0;
  state.absenceHistory.push({at:Date.now(),stage:state.stage,source:'Reactivación autorizada por docente'});
  away=false;
  pendingWarning=false;
  clearTimeout(blurTimer);
  document.getElementById('absenceOverlay')?.remove();
  persist();
  render();
}
function blockedScreen(){
  shell(`<section class="panel" style="text-align:center"><div class="tag" style="color:#ffaaaa">MISIÓN BLOQUEADA · SEGUNDA INCIDENCIA</div><h1>Actividad suspendida</h1><p>Se registraron <b>${state.absenceCount} salidas</b> de la ventana durante la misión. La primera generó una advertencia; la segunda produjo el bloqueo.</p><div class="risk" style="text-align:left"><strong>Acceso suspendido:</strong> la misión y la puntuación se conservan. Solo el docente puede reactivar la actividad mediante su contraseña. Al reactivar se reinicia el contador de advertencias, sin borrar el historial.</div><div class="grid"><div class="card"><p>Estudiante</p><h2>${esc(state.name)}</h2></div><div class="card"><p>Puntuación al bloquear</p><div class="score">${state.score}/100</div></div></div><div class="detail" style="text-align:left;margin-top:18px"><h3>Reactivación autorizada</h3><label for="teacherPassword">Contraseña del docente</label><div class="row"><input type="password" id="teacherPassword" autocomplete="off" placeholder="Contraseña de reactivación" onkeydown="if(event.key==='Enter')unlockMission()"><button class="btn" onclick="unlockMission()">Reactivar actividad</button></div><div id="unlockFeedback" class="notice hidden" role="alert"></div></div><p class="small">Registro local de incidencias: ${state.absenceHistory.map((x,i)=>`#${i+1} · fase ${x.stage+1} · ${new Date(x.at).toLocaleString('es-GT')}`).join(' | ')}</p></section>`);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)registerAbsence('pestaña oculta o ventana minimizada');
  else recovered();
});
window.addEventListener('blur',()=>{
  clearTimeout(blurTimer);
  blurTimer=setTimeout(()=>{if(!document.hidden && !document.hasFocus())registerAbsence('ventana sin foco');},650);
});
window.addEventListener('focus',recovered);
// Comando secreto estilo videojuego (solo para uso docente).
// Arriba, Arriba, Abajo, Abajo, Izquierda, Derecha, Izquierda, Derecha, B, A.
// Exige además la contraseña docente antes de eliminar el progreso.
const RESET_COMBO=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let resetComboPosition=0;
let resetComboTime=0;
document.addEventListener('keydown',event=>{
  if(event.repeat || event.ctrlKey || event.metaKey || event.altKey)return;
  const target=event.target;
  if(target && (target.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(target.tagName)))return;
  const key=event.key.length===1?event.key.toLowerCase():event.key;
  if(Date.now()-resetComboTime>10000)resetComboPosition=0;
  resetComboTime=Date.now();
  if(key===RESET_COMBO[resetComboPosition])resetComboPosition++;
  else resetComboPosition=key===RESET_COMBO[0]?1:0;
  if(resetComboPosition!==RESET_COMBO.length)return;
  resetComboPosition=0;
  event.preventDefault();
  const password=prompt('MODO DOCENTE: introduce la contraseña para reiniciar la simulación desde cero.');
  if(password!=='tech01'){
    if(password!==null)alert('Contraseña incorrecta. No se ha modificado el progreso.');
    return;
  }
  if(!confirm('ATENCIÓN: se borrarán el nombre, los puntos, las fases, las penalizaciones y los bloqueos de esta misión en este navegador. ¿Reiniciar desde cero?'))return;
  clearTimeout(blurTimer);
  document.getElementById('absenceOverlay')?.remove();
  away=false;
  pendingWarning=false;
  state=initial();
  persist();
  render();
  alert('Simulación reiniciada. Puedes comenzar una misión nueva.');
});
restore();render();
// Se activa tras inicializar la pantalla para evitar eventos espurios durante la carga.
monitorReady=true;
if(activeMission() && !document.hidden && document.hasFocus() && state.absenceCount===1){
  // Al recargar, la advertencia ya registrada se conserva sin contar una nueva salida.
}


</script></body></html>
